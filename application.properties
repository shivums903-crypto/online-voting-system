spring.datasource.url=jdbc:mysql://localhost:3306/online_voting
spring.datasource.username=root
spring.datasource.password=Shree123

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
# Create the admin table on first startup without changing existing voting tables.
spring.sql.init.mode=always

# Local demo admin credentials. Override APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD before deployment.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
